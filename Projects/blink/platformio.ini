; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32thing_plus]
platform = espressif32
board = esp32thing_plus
framework = arduino
monitor_speed = 115200



; ==============================
; 🔧 Common Useful Options
; ==============================

; --- Serial / Upload ---
; upload_port = COM5                ; Specify a custom upload port manually
; upload_speed = 921600             ; Faster flashing (default: 115200)
; monitor_port = COM5               ; Explicitly set serial monitor port
; monitor_filters = esp32_exception_decoder, time, colorize ; Useful for better debugging

; --- Build Settings ---
; build_flags = -DDEBUG_MODE -Os    ; Pass custom defines or flags
; build_type = debug                ; debug | release
; upload_protocol = esptool         ; or "espota" for OTA uploads
; extra_scripts = pre:pre_build.py  ; Add pre/post build scripts

; --- Partition / Flash ---
; board_build.partitions = huge_app.csv  ; Custom partition layout (SPIFFS, etc.)
; board_upload.flash_size = 4MB          ; Override flash size if needed

; --- File System Upload (if using SPIFFS/LittleFS) ---
; board_build.filesystem = littlefs
; upload_port = COM5
; extra_scripts = uploadfs.py

; --- WiFi OTA Upload (optional) ---
; upload_protocol = espota
; upload_port = 192.168.1.42
; upload_flags =
;   --port=3232
;   --auth=YourPassword

; --- Debugging ---
; debug_tool = esp-prog
; debug_init_break = tbreak setup
; monitor_filters = default, esp32_exception_decoder
; debug_build_flags = -Og -ggdb

; --- Libraries ---
; lib_deps =
;   adafruit/Adafruit BusIO@^1.14.1
;   adafruit/Adafruit Unified Sensor@^1.1.14
;   bblanchon/ArduinoJson@^6.21.3

; --- Custom Paths ---
; lib_extra_dirs = C:\Users\Natai\Documents\Arduino\libraries
; build_src_filter = +<src/> -<test/> ; Include/exclude folders

; --- Power Optimization / SDK Config ---
; board_build.sdkconfig = sdkconfig.defaults  ; For advanced ESP-IDF tweaks
; board_build.mcu = esp32s3                   ; If your board variant differs

; --- Other Handy Settings ---
; monitor_rts = 0
; monitor_dtr = 0
; monitor_echo = yes
; monitor_eol = LF
; monitor_flags = --raw